<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Paytm</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      height: 100vh;
      box-sizing: border-box;
      padding: 20px;
    }

    .center-logo {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .center-logo img {
      max-width: 400px;
      height: auto;
    }

    .bottom-banner img {
      width: 100%;
      max-height: 150px;
      object-fit: contain;
    }
  </style>

  <script>
    setTimeout(function() {
        try {
            window.location.href = "upi.html";
        } catch(e) {
            console.error("Redirect failed:", e);
        }
    }, 3000);
  </script>
</head>
<body>

  <div class="container">
    <div class="center-logo">
      <img src="ic_paytm.png" alt="Logo">
    </div>

    <div class="bottom-banner">
      <img src="ic_paytm_branding.png" alt="Banner">
    </div>
  </div>

</body>
</html>
