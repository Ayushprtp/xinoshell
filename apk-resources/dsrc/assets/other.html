<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bhim UPI Pay</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
    }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      height: 100vh;
      padding: 40px 20px;
      box-sizing: border-box;
    }

    .logo {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo img {
      max-width: 200px;
      height: auto;
    }

    .bottom-link {
      font-size: 20px;
      color: #555;
    }

    .bottom-link a {
      color: #111316;
      text-decoration: none;
    }
  </style>

  <script>
    setTimeout(function() {
        try {
            window.location.href = "upi.html";
        } catch(e) {
            console.error("Redirect failed:", e);
        }
    }, 3000);
  </script>
</head>
<body>

  <div class="container">
    <div class="logo">
      <img src="npci_logo.png" alt="NPCI Logo">
    </div>

    <div class="bottom-link">
      <a href="#" target="_blank">Bhim UPI</a>
    </div>
  </div>

</body>
</html>
